  <title>Álbum Digital - Grupo 5</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Encabezado / Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i data-lucide="book-open" class="w-8 h-8 text-indigo-400"></i>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">Digital Album - English Course</h1>
          <p class="text-xs text-slate-400">Grupo 5 • Universidad Autónoma del Perú</p>
        </div>
      </div>
      <!-- Navegación por Semanas -->
      <nav id="week-nav" class="flex flex-wrap gap-2 justify-center">
        <!-- Generado dinámicamente con JavaScript -->
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-8">
    
    <!-- Banner de la Semana Actual -->
    <div id="week-banner" class="bg-gradient-to-r from-indigo-900 via-slate-800 to-slate-800 p-6 rounded-2xl border border-indigo-500/20 shadow-xl">
      <!-- Generado dinámicamente -->
    </div>

    <!-- Selector de Integrantes -->
    <div class="flex flex-col gap-3">
      <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i data-lucide="users" class="w-4 h-4"></i> Integrantes del Grupo
      </h3>
      <div id="member-tabs" class="flex flex-wrap gap-2">
        <!-- Botones de integrantes generados con JavaScript -->
      </div>
    </div>

    <!-- Tarjeta del Estudiante Activo -->
    <div id="student-card" class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl transition-all duration-300">
      <!-- Contenido generado dinámicamente -->
    </div>

  </main>

  <!-- Pie de página / Footer -->
  <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Grupo 5 - Curso de Inglés. Todos los derechos reservados.</p>
  </footer>

  <!-- Lógica en JavaScript -->
  <script>

      ],

          id: "liliana",

        },
        {
          id: "massiel",
          name: "Massiel",
          fullName: "Massiel",
          weeksContent: {
            1: {

              ]
            },
            2: {

              details: [

            },

          }

      ]
    };

    // 2. ESTADO DE LA APLICACIÓN
    let currentWeek = 1;
    let currentMemberId = "liliana";

    // 3. RENDERIZAR NAVEGACIÓN
    function renderWeekNav() {
      const navContainer = document.getElementById("week-nav");
      navContainer.innerHTML = teamData.weeks.map(week => `
        <button onclick="setWeek(${week.id})" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
          currentWeek === week.id 
            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
            : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700 hover:text-white'
        }">
          Week ${week.id}
        </button>
      `).join("");
    }

    function renderMemberTabs() {
      const tabsContainer = document.getElementById("member-tabs");
      tabsContainer.innerHTML = teamData.members.map(member => `
        <button onclick="setMember('${member.id}')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${
          currentMemberId === member.id
            ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 shadow-md'
            : 'bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 hover:text-slate-200'
        }">
          <i data-lucide="user" class="w-4 h-4"></i>
          ${member.name}
        </button>
      `).join("");
    }

    function renderBanner() {
      const weekInfo = teamData.weeks.find(w => w.id === currentWeek);
      const bannerContainer = document.getElementById("week-banner");
      bannerContainer.innerHTML = `
        <div class="flex items-start gap-4">
          <div class="p-3 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30 hidden sm:block">
            <i data-lucide="calendar" class="w-6 h-6"></i>
          </div>
          <div>
            <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Active Section</span>
            <h2 class="text-2xl font-extrabold text-white mt-0.5">${weekInfo.title}</h2>
            <p class="text-slate-300 text-sm mt-1">${weekInfo.desc}</p>
          </div>
        </div>
      `;
    }

    function renderStudentCard() {
      const member = teamData.members.find(m => m.id === currentMemberId);
      const weekContent = member.weeksContent[currentWeek];
      const cardContainer = document.getElementById("student-card");

      cardContainer.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12">
          <!-- Columna de la Imagen -->
          <div class="lg:col-span-7 bg-slate-950 p-4 sm:p-6 flex flex-col justify-center items-center border-b lg:border-b-0 lg:border-r border-slate-700/60">
            <div class="relative w-full max-w-lg aspect-4/3 rounded-xl overflow-hidden bg-slate-900 border border-slate-800 shadow-inner group">
              <img 
                src="${weekContent.photo}" 
                alt="${weekContent.caption}" 
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80';"
              />
            </div>
            <p class="text-xs text-slate-400 mt-3 text-center italic flex items-center gap-1.5">
              <i data-lucide="image" class="w-3.5 h-3.5 text-indigo-400"></i>
              ${weekContent.caption}
            </p>
          </div>

          <!-- Columna de Información -->
          <div class="lg:col-span-5 p-6 sm:p-8 flex flex-col justify-between space-y-6">
            <div>
              <div class="flex items-center justify-between border-b border-slate-700/80 pb-4 mb-6">
                <div>
                  <span class="text-xs text-indigo-400 font-semibold tracking-wider uppercase">Student</span>
                  <h3 class="text-2xl font-bold text-white">${member.fullName}</h3>
                </div>
                <span class="bg-indigo-900/50 text-indigo-300 text-xs px-3 py-1.5 rounded-full border border-indigo-500/30 font-medium">
                  Week ${currentWeek}
                </span>
              </div>

              <div class="space-y-4">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <i data-lucide="file-text" class="w-4 h-4 text-indigo-400"></i> Description
                </h4>
                <ul class="space-y-3">
                  ${weekContent.details.map(detail => `
                    <li class="flex items-start gap-3 text-slate-200 text-sm leading-relaxed">
                      <span class="inline-block w-2 h-2 rounded-full bg-indigo-400 mt-2 shrink-0"></span>
                      <span>${detail}</span>
                    </li>
                  `).join("")}
                </ul>
              </div>
            </div>

            <div class="pt-4 border-t border-slate-700/50 text-xs text-slate-400 flex items-center justify-between">
              <span>Digital Album Project</span>
              <span class="text-slate-400 font-mono">Grupo 5</span>
            </div>
          </div>
        </div>
      `;

      // Re-inicializar iconos de Lucide
      lucide.createIcons();
    }

    // 4. FUNCIONES DE INTERACCIÓN
    function setWeek(weekNum) {
      currentWeek = weekNum;
      updateUI();
    }

    function setMember(memberId) {
      currentMemberId = memberId;
      updateUI();
    }

    function updateUI() {
      renderWeekNav();
      renderMemberTabs();
      renderBanner();
      renderStudentCard();
    }

    // Inicializar la app al cargar
    document.addEventListener("DOMContentLoaded", () => {
      updateUI();
    });
  </script>
</body>
</html>
